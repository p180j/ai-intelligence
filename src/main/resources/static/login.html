<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>管理员登录 · AI 前沿情报</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-card">
        <p class="login-eyebrow">AI 前沿情报</p>
        <h1>管理员登录</h1>
        <p class="muted">请输入管理员账号、密码和验证器中的 6 位动态码。</p>
        <p class="login-message login-error" id="login-error" hidden>账号、密码或动态验证码不正确。</p>
        <p class="login-message login-success" id="logout-message" hidden>已安全退出管理后台。</p>
        <form method="post" action="/login">
            <label class="login-field">
                <span>管理员账号</span>
                <input name="username" autocomplete="username" required autofocus>
            </label>
            <label class="login-field">
                <span>密码</span>
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <label class="login-field">
                <span>6 位动态码</span>
                <input name="totp" type="text" inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
            </label>
            <button class="login-submit" type="submit">验证并进入管理台</button>
        </form>
        <a class="login-back" href="/">返回用户首页</a>
    </section>
</main>
<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('login-error').hidden = !params.has('error');
    document.getElementById('logout-message').hidden = !params.has('logout');
</script>
</body>
</html>
