spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_intelligence_phase23?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:18084}
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}
  totp-secret: ${ADMIN_TOTP_SECRET:G5RJTTY7DLQBYU3CSTXKIVZU5QC25IRA}
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:18084}
collector:
  enabled: ${COLLECTOR_ENABLED:false}
  fixed-delay-ms: ${COLLECTOR_DELAY_MS:1800000}
ai:
  provider: ${AI_PROVIDER:openai}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:45}
  match-confidence-threshold: ${AI_MATCH_THRESHOLD:0.85}
  score-weights:
    developer-value: 0.30
    impact: 0.20
    technical: 0.15
    availability: 0.15
    credibility: 0.15
    freshness: 0.05
